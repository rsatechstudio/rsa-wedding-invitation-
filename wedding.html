
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation | RSA Tech Studio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(145deg, #260b16, #5a2035, #260b16);
    color: #f5e4c2;
    font-family: Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.invitation {
    width: 100%;
    max-width: 440px;
    min-height: 620px;
    border: 1px solid #c9a45e;
    padding: 35px 22px;
    text-align: center;
    position: relative;
    background: linear-gradient(160deg, #431426, #2b0c19);
    box-shadow: 0 0 35px #12050b;
}

.brand {
    font-family: Arial, sans-serif;
    letter-spacing: 5px;
    font-size: 11px;
    color: #d9b76e;
    margin-bottom: 45px;
}

.om {
    font-size: 38px;
    color: #e7c77f;
    margin-bottom: 20px;
}

.small {
    font-size: 12px;
    letter-spacing: 3px;
    color: #e0c58e;
}

h1 {
    font-size: 35px;
    font-weight: normal;
    line-height: 1.4;
    color: #f5dfad;
    margin: 20px 0;
}

.divider {
    width: 100px;
    height: 1px;
    background: #c9a45e;
    margin: 25px auto;
}

.message {
    font-size: 15px;
    line-height: 2;
    color: #ead9c0;
}

.names {
    font-size: 24px;
    color: #f0d18c;
    margin: 22px 0;
}

.open-btn {
    display: inline-block;
    margin-top: 35px;
    padding: 15px 28px;
    border: 1px solid #d7b66e;
    color: #f7e4b8;
    text-decoration: none;
    letter-spacing: 2px;
    font-size: 11px;
    background: linear-gradient(120deg, #80502d, #4a1c2b);
}

.open-btn:active {
    transform: scale(0.96);
}

.footer {
    margin-top: 45px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: #c9a45e;
}

</style>
</head>

<body>

<div class="invitation">

    <div class="brand">RSA TECH STUDIO</div>

    <div class="om">॥ श्री गणेशाय नमः ॥</div>

    <div class="small">YOU ARE CORDIALLY INVITED</div>

    <h1>A Beautiful<br>Wedding Celebration</h1>

    <div class="divider"></div>

    <p class="message">
        Two hearts, one beautiful journey.<br>
        With the blessings of our families,<br>
        we invite you to celebrate<br>
        a special beginning.
    </p>

    <div class="names">
        Aarav & Priya
    </div>

    <div class="divider"></div>

    <a href="ceremonies.html" class="open-btn">
        OPEN INVITATION →
    </a>

    <div class="footer">
        MADE WITH LOVE<br>
        RSA TECH STUDIO
    </div>

</div>

</body>
</html>
